x-app-base: &app-base
  build:
    context: .
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: payment-gateway-php
  volumes:
    - .:/var/www/html
  environment:
    DB_HOST: pgsql
    REDIS_HOST: redis
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis

services:
  pgsql:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-payment_gateway}
      POSTGRES_USER: ${DB_USERNAME:-payment_gateway}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgsql-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-payment_gateway} -d ${DB_DATABASE:-payment_gateway}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  init:
    <<: *app-base
    restart: "no"
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        [ -f .env ] || cp .env.example .env
        [ -f vendor/autoload.php ] || composer install --no-interaction --prefer-dist
        grep -q '^APP_KEY=base64:' .env || php artisan key:generate --force
        php artisan migrate --force --isolated --no-interaction

  app:
    <<: *app-base
    command: php artisan serve --host=0.0.0.0 --port=8000
    environment:
      DB_HOST: pgsql
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      PHP_CLI_SERVER_WORKERS: 4
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/up"]
      interval: 10s
      timeout: 5s
      start_period: 20s

  worker:
    <<: *app-base
    command: php artisan queue:work redis --queue=default --sleep=3 --tries=5 --backoff=10,30,90,270 --timeout=60 --max-time=3600
    init: true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 70s
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "artisan", "app:health", "--only=worker"]
      interval: 15s
      timeout: 10s
      start_period: 30s

volumes:
  pgsql-data:
  redis-data:
